<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>视频观看时间管家</title>
  <style>
    body { min-width: 300px; margin: 0; padding: 16px 20px; font: 14px "Microsoft YaHei", system-ui, sans-serif; color: #1f2937; }
    h1 { font-size: 16px; margin: 0 0 14px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
    input { width: 64px; padding: 4px 6px; font-size: 14px; text-align: right; }
    .note { font-size: 12px; color: #6b7280; margin: -4px 0 10px; }
    .buttons { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 7px 0; font-size: 14px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    #msg { min-height: 18px; margin-top: 8px; font-size: 12px; color: #16a34a; }
    .status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #f3f4f6; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>视频观看时间管家</h1>
  <label>每次可观看（分钟）<input id="watchMin" type="number" min="1" max="600"></label>
  <label>标准休息时长（分钟）<input id="restMin" type="number" min="1" max="600"></label>
  <div class="note">实际休息 = 本次实际观看 ÷ 每次可观看 × 标准休息，最少 1 分钟，最多 2 倍标准休息。</div>
  <label>每次最多允许超时（分钟）<input id="graceMin" type="number" min="0" max="600"></label>
  <div class="note">尽量在一集的结尾或开头休息：比较提前停和看完这一集再停，选偏差小的；超时会超过该值时提前停。</div>
  <label>每天最多观看（分钟）<input id="dailyMaxMin" type="number" min="1" max="1440"></label>
  <label>每天最多允许超时（分钟）<input id="dailyGraceMin" type="number" min="0" max="600"></label>
  <div class="note">每天的上限同样尽量在集边界结束；结束后当天不能再看，零点自动解除。</div>
  <div class="buttons">
    <button id="save" class="primary">保存设置</button>
    <button id="reset">全部重置</button>
  </div>
  <div id="msg"></div>
  <div class="status" id="status">读取中…</div>
  <script src="options.js"></script>
</body>
</html>
